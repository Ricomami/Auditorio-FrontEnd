<div class="container">
  <h1 class="mt-3">Editar auditorio</h1>
  <a [routerLink]="['/auditorio']">Regresar</a>

  <form #formulario="ngForm" (ngSubmit)="actualizarAuditorio()" class="mt-4 needs-validation" novalidate>
    <h4 class="my-4">ID de auditorio: {{auditorio.id_auditorio}} </h4>

    <!-- NOMBRE -->
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre del Auditorio</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="auditorio.nombre"
        #nombre="ngModel"
        required
        minlength="3"
        class="form-control"
        [class.is-invalid]="nombre.invalid && nombre.touched"
        [class.is-valid]="nombre.valid && nombre.touched"
      />
      <div *ngIf ="nombre.invalid && nombre.touched" class="invalid-feedback">
        El nombre es obligatorio y debe tener al menos 3 caracteres.
      </div>
    </div>

    <!-- CAPACIDAD -->
    <div class="mb-3">
      <label for="capacidad" class="form-label">Capacidad</label>
      <input
        type="number"
        id="capacidad"
        name="capacidad"
        [(ngModel)]="auditorio.capacidad"
        #capacidad="ngModel"
        required
        min="10"
        class="form-control"
        [class.is-invalid]="capacidad.invalid && capacidad.touched"
        [class.is-valid]="capacidad.valid && capacidad.touched"
      />
      <div *ngIf="capacidad.invalid && capacidad.touched" class="invalid-feedback">
        Ingrese una capacidad válida (mínimo 10).
      </div>
    </div>

    <!-- DIRECCIÓN -->
    <div class="mb-3">
      <label for="direccion" class="form-label">Dirección</label>
      <input
        type="text"
        id="direccion"
        name="direccion"
        [(ngModel)]="auditorio.direccion"
        #direccion="ngModel"
        class="form-control"
        [class.is-invalid]="direccion.invalid && direccion.touched"
        [class.is-valid]="direccion.valid && direccion.touched"
      />
      <div *ngIf="direccion.invalid && direccion.touched" class="invalid-feedback">
        La dirección es obligatoria.
      </div>
    </div>

    <!-- VISTA PREVIA DE LA IMAGEN EXISTENTE -->
     <img 
     [src]="auditorio.imagen_auditorio" 
     alt="Auditorio"
     loading="lazy"
     width="450"
     style="object-fit: cover; border-radius: 8px;" />

    <!-- IMAGEN -->
    <div class="mb-3">
      <label for="imagen_auditorio" class="form-label">Imagen</label>
      <input
        type="file"
        id="imagen_auditorio"
        name="imagen_auditorio"
        accept="image/*"
        (change)="onFileSelected($event)"
        class="form-control"
        />
    </div>

    <!-- ESTADO -->
    <div class="mb-3">
      <label for="estado" class="form-label">Estado</label>
      <select
        id="estado"
        name="estado"
        [(ngModel)]="auditorio.estado"
        #estado="ngModel"
        required
        class="form-select"
        [class.is-invalid]="estado.invalid && estado.touched"
        [class.is-valid]="estado.valid && estado.touched"
      >
        <option value="" disabled selected>Seleccione un estado</option>
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
        <option value="Mantenimiento">Mantenimiento</option>
      </select>
      <div *ngIf="estado.invalid && estado.touched" class="invalid-feedback">
        Seleccione un estado válido.
      </div>
    </div>

    <!-- BOTÓN DE ENVÍO -->
    <button type="submit" class="btn btn-success w-100" [disabled]="formulario.invalid">
      Actualizar Auditorio
    </button>

    <!-- ALERTA DE ÉXITO -->
    <div *ngIf="mensajeExito" class="alert alert-success mt-4" role="alert">
      🎉 {{ mensajeExito }}
    </div>

    <!-- ALERTA DE ERROR -->
    <div *ngIf="mensajeError" class="alert alert-danger mt-4" role="alert">
      ⚠️ {{ mensajeError }}
    </div>
  </form>
</div>
