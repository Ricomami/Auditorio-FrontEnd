<div class="container">
  <h1 class="mt-3">Registrar asiento nuevo</h1>
  <a [routerLink]="['/asiento']">Regresar</a>

  <form #formulario="ngForm" (ngSubmit)="CrearAsiento()" class="mt-5 needs-validation" novalidate>

    <!-- SECCION_ID -->
        <div class="mb-3">
            <label for="seccion_id" class="form-label">ID de la Seccion</label>
            <input
            type="number"
            id="seccion_id"
            name="seccion_id"
            [(ngModel)]="asiento.seccion_id"
            #seccion_id="ngModel"
            required
            min="1"
            class="form-control"
            [class.is-invalid]="seccion_id.invalid && seccion_id.touched"
            [class.is-valid]="seccion_id.valid && seccion_id.touched"
            />
            <div *ngIf = "seccion_id.invalid && seccion_id.touched" class="invalid-feedback">
        Ingrese una id de seccion válido.
      </div>
    </div>

    <!-- FILA -->
        <div class="mb-3">
            <label for="fila" class="form-label">Letra de la fila del asiento</label>
            <input
            type="text"
            id="fila"
            name="fila"
            [(ngModel)]="asiento.fila"
            #fila="ngModel"
            required
            minlength="1"
            maxlength="1"
            class="form-control"
            [class.is-invalid]="fila.invalid && fila.touched"
            [class.is-valid]="fila.valid && fila.touched"
            />
            <div *ngIf="fila.invalid && fila.touched" class="invalid-feedback">
        La fila no puede estar vacía y debe ser una sola letra.
      </div>
    </div>

    <!-- NUMERO ASIENTO -->
        <div class="mb-3">
            <label for="numero_asiento" class="form-label">Numero del asiento</label>
            <input
            type="number"
            id="numero_asiento"
            name="numero_asiento"
            [(ngModel)]="asiento.numero_asiento"
            #numero_asiento="ngModel"
            required
            min="1"
            class="form-control"
            [class.is-invalid]="numero_asiento.invalid && numero_asiento.touched"
            [class.is-valid]="numero_asiento.valid && numero_asiento.touched"
            />
            <div *ngIf="numero_asiento.invalid && numero_asiento.touched" class="invalid-feedback">
        El numero del asiento es requerido y debe ser de al menos 1.
      </div>
    </div>

    <!-- ESTADO -->
    <div class="mb-3">
      <label for="estado" class="form-label">Estado</label>
      <select
        id="estado"
        name="estado"
        [(ngModel)]="asiento.estado"
        #estado="ngModel"
        required
        class="form-select"
        [class.is-invalid]="estado.invalid && estado.touched"
        [class.is-valid]="estado.valid && estado.touched"
      >
        <option value="" disabled selected>Seleccione un estado</option>
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
        <option value="Pendiente">Pendiente</option>
      </select>
      <div *ngIf="estado.invalid && estado.touched" class="invalid-feedback">
        Seleccione un estado válido.
      </div>
    </div>
    
    <!-- BOTÓN DE ENVÍO -->
    <button type="submit" class="btn btn-primary w-100" [disabled]="formulario.invalid">
      Registrar Asiento
    </button>

    <!-- ALERTA DE ÉXITO -->
    <div *ngIf="mensajeExito" class="alert alert-success mt-4" role="alert">
      🎉 {{ mensajeExito }}
    </div>

    <!-- ALERTA DE ERROR -->
    <div *ngIf="mensajeError" class="alert alert-danger mt-4" role="alert">
      ⚠️ {{ mensajeError }}
    </div>
  </form>
</div>
