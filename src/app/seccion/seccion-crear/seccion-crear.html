<div class="container">
    <h1 class="mt-3">Crear seccion nueva</h1>
    <a [routerLink]="['/seccion']" href="#">Regresar</a>

  <form #formulario="ngForm" (ngSubmit)="CrearSeccion()" class="mt-5 needs-validation" novalidate enctype="multipart/form-data">

    <!-- NOMBRE SECCION -->
    <div class="mb-3">
         <label for="nombre_seccion" class="form-label">Nombre de la seccion</label>
        <input
            type="text"
            id="nombre_seccion"
            name="nombre_seccion"
            [(ngModel)]="seccion.nombre_seccion"
            #nombre="ngModel"
            required
            minlength="3"
            class="form-control"
            [class.is-invalid]="nombre.invalid && nombre.touched"
            [class.is-valid]="nombre.valid && nombre.touched"
        />
        <div *ngIf="nombre.invalid && nombre.touched" class="invalid-feedback">
        El nombre es obligatorio y debe tener al menos 3 caracteres.
      </div>
    </div>
    
    <!-- PRECIO BASE -->
    <div class="mb-3">
      <label for="precio_base" class="form-label">Precio base</label>
      <input
        type="number"
        id="precio_base"
        name="precio_base"
        [(ngModel)]="seccion.precio_base"
        #precio_base="ngModel"
        required
        min="30"
        class="form-control"
        [class.is-invalid]="precio_base.invalid && precio_base.touched"
        [class.is-valid]="precio_base.valid && precio_base.touched"
      />
      <div *ngIf="precio_base.invalid && precio_base.touched" class="invalid-feedback">
        Ingrese una precio_base válido (mínimo 30).
      </div>
    </div>

    <!-- AUDITORIO_ID -->
    <div class="mb-3">
      <label for="auditorio_id" class="form-label">Id del auditorio con esta seccion</label>
      <input
        type="number"
        id="auditorio_id"
        name="auditorio_id"
        [(ngModel)]="seccion.auditorio_id"
        #auditorio_id="ngModel"
        required
        min="1"
        class="form-control"
        [class.is-invalid]="auditorio_id.invalid && auditorio_id.touched"
        [class.is-valid]="auditorio_id.valid && auditorio_id.touched"
      />
      <div *ngIf="auditorio_id.invalid && auditorio_id.touched" class="invalid-feedback">
        Ingrese una auditorio_id válido (mínimo 30).
      </div>
    </div>

    <!-- IMAGEN -->
    <div class="my-3">
      <label for="imagen" class="form-label">Imagen</label>
      <input
        type="file"
        id="imagen"
        name="imagen"
        accept="image/*"
        (change)="onFileSelected($event)"
        class="form-control"
      />
    </div>
    
        <!-- ESTADO -->
    <div class="mb-3">
      <label for="estado" class="form-label">Estado</label>
      <select
        id="estado"
        name="estado"
        [(ngModel)]="seccion.estado"
        #estado="ngModel"
        required
        class="form-select"
        [class.is-invalid]="estado.invalid && estado.touched"
        [class.is-valid]="estado.valid && estado.touched"
      >
        <option value="" disabled selected>Seleccione un estado</option>
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
        <option value="Mantenimiento">Mantenimiento</option>
        <option value="Archivado">Archivado</option>
      </select>
      <div *ngIf="estado.invalid && estado.touched" class="invalid-feedback">
        Seleccione un estado válido.
      </div>
    </div>

    <!-- BOTÓN DE ENVÍO -->
    <button type="submit" class="btn btn-primary w-100" [disabled]="formulario.invalid">
      Crear Auditorio
    </button>

    <!-- ALERTA DE ÉXITO -->
    <div *ngIf="mensajeExito" class="alert alert-success mt-4" role="alert">
      🎉 {{ mensajeExito }}
    </div>

    <!-- ALERTA DE ERROR -->
    <div *ngIf="mensajeError" class="alert alert-danger mt-4" role="alert">
      ⚠️ {{ mensajeError }}
    </div>
    </form>
</div>
